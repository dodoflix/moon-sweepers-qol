name: Release

# Manual by design: push a tag when a build is worth shipping.
#   git tag -a v1.0.0 -m "what changed"
#   git push origin v1.0.0
# The tag has to match Version in src/Plugin.cs.
# workflow_dispatch re-runs a tag that already exists, for a failed upload.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read the tag
        id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          # An annotated tag's own message is the changelog; a lightweight tag
          # falls back to the subjects since the previous one.
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            PREVIOUS="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            RANGE="${PREVIOUS:+$PREVIOUS..}$TAG"
            NOTES="$(git log --no-merges --format='- %s' "$RANGE")"
          fi
          {
            echo 'notes<<CHANGELOG_EOF'
            printf '%s\n' "$NOTES"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      # A runner has no copy of the game, so this compiles against the signature-only
      # assemblies in refs/. scripts/refs.sh regenerates them.
      - name: Package
        run: |
          PLUGIN="$(sed -n 's/.*const string Version = "\(.*\)";/\1/p' src/Plugin.cs)"
          if [ "$PLUGIN" != "${{ steps.tag.outputs.version }}" ]; then
            echo "Tag ${{ steps.tag.outputs.tag }} does not match Version $PLUGIN in src/Plugin.cs." >&2
            exit 1
          fi
          ./scripts/package.sh

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "${{ steps.tag.outputs.notes }}" \
            "dist/MoonSweepersQol-${{ steps.tag.outputs.version }}.zip" \
            || gh release upload "${{ steps.tag.outputs.tag }}" \
                 "dist/MoonSweepersQol-${{ steps.tag.outputs.version }}.zip" --clobber

      - name: Check the Nexus settings
        id: nexus
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          if [ -z "$NEXUSMODS_API_KEY" ] || [ -z "${{ vars.NEXUS_FILE_ID }}" ] || [ -z "${{ vars.NEXUS_MOD_ID }}" ]; then
            echo "NEXUSMODS_API_KEY, NEXUS_FILE_ID or NEXUS_MOD_ID is not set - skipping the Nexus upload." >&2
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Nexus Mods
        if: steps.nexus.outputs.ready == 'true'
        uses: Nexus-Mods/upload-action@v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          filename: dist/MoonSweepersQol-${{ steps.tag.outputs.version }}.zip
          version: ${{ steps.tag.outputs.version }}
          changelog: ${{ steps.tag.outputs.notes }}
          archive_existing_version: 'true'
          update_mod_version: 'true'
